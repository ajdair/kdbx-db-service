server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy to the gateway, the browser needs no CORS.
  # The upstream is resolved per request (Docker DNS) - nginx starts regardless of the gateway being up yet.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://kx-db-gw:8080;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    client_max_body_size 64m;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: fallback to index.html for unknown routes
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
